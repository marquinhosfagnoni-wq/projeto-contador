<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingressos | Tomorrowland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(5,9,24,.88), rgba(5,9,24,.95)),
                url("https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1800&q=85") center/cover fixed;
        }

        .form-page {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 80px;
        }

        .form-card {
            width: min(650px, 100%);
            padding: 42px;
            background: rgba(10,15,33,.94);
            border: 1px solid rgba(255,255,255,.14);
        }

        .form-card h1 {
            font-size: clamp(34px, 5vw, 52px);
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .form-card .intro {
            color: #949aae;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            color: #aeb3c3;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field input,
        .field select {
            width: 100%;
            border: 1px solid #293149;
            outline: 0;
            border-radius: 2px;
            padding: 13px;
            background: #080d1c;
            color: #fff;
            font: inherit;
            font-size: 12px;
        }

        .field input:focus,
        .field select:focus {
            border-color: #6bd9e8;
        }

        .submit {
            width: 100%;
            margin-top: 25px;
            border: 0;
            cursor: pointer;
        }

        .aviso {
            text-align: center;
            color: #676e82;
            font-size: 9px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 28px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>

<header class="cadastro-topo">
    <a href="index.html" class="logo">TOMORROWLAND</a>
    <a href="index.html" class="voltar">← Voltar para o site</a>
</header>

<main class="form-page">
    <form class="form-card" id="formulario">
        <p class="label">INGRESSOS 2026</p>
        <h1>Faça seu cadastro.</h1>
        <p class="intro">Preencha seus dados abaixo para continuar com a escolha do ingresso.</p>

        <div class="form-grid">
            <div class="field full">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" required>
            </div>

            <div class="field">
                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" required>
            </div>

            <div class="field">
                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="1" max="10" value="1" required>
            </div>

            <div class="field full">
                <label for="ingresso">Tipo de ingresso</label>
                <select id="ingresso" required>
                    <option value="">Selecione uma opção</option>
                    <option>Entrada comum</option>
                    <option>VIP</option>
                    <option>Premium</option>
                </select>
            </div>
        </div>

        <button type="submit" class="main-button submit">Finalizar cadastro</button>
        <p class="aviso">Projeto acadêmico — página demonstrativa.</p>
    </form>
</main>

<script>
    document.getElementById("formulario").addEventListener("submit", function(event) {
        event.preventDefault();
        alert("Cadastro realizado com sucesso!");
    });
</script>

</body>
</html>
